name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CYPRESS_INSTALL_BINARY: 0
    services:
      db: &db
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: test
        ports:
          - 5433:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: GraphQL client is up to date
        run: pnpm graphql:types && git diff --exit-code src/schema.gql src/client/lib/zeus

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db: *db
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typeorm migration:run && pnpm cli seed
      - name: Migrations match the entities
        run: pnpm typeorm migration:generate --check src/server/migration/Drift
      - uses: cypress-io/github-action@v7
        with:
          install: false
          start: pnpm start:prod
          wait-on: http://localhost:3000
          wait-on-timeout: 120
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-artifacts
          path: cypress/screenshots

  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          cache-from: type=gha
          cache-to: type=gha
